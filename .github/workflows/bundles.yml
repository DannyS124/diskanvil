#
# Builds the Flatpak and the AppImage. On a push to main they're kept as test
# downloads (Actions tab); when a release is published they're attached to it.
# To redo them for a release that's already out (after fixing this file):
#   gh workflow run bundles.yml -f tag=v0.5.0
name: bundles

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Build this release's source and attach the bundles to it (e.g. v0.5.0). Empty = just build.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master, 2025-04-24
        with:
          bundle: DiskAnvil-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.DannyS124.DiskAnvil.yml
          cache-key: flatpak-builder-${{ github.sha }}

  appimage:
    runs-on: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more systems
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.*'
          # WebP, TIFF... in Find Lost Files' previews; films and songs that play in its viewer (Qt's
          # FFmpeg backend, which comes with its own FFmpeg)
          modules: qtimageformats qtmultimedia
          cache: true
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev libssl-dev libblkid-dev libarchive-dev zlib1g-dev pkg-config ninja-build desktop-file-utils \
            libfreetype-dev libfontconfig1-dev libjpeg-dev libpng-dev libopenjp2-7-dev liblcms2-dev
          # Ubuntu 22.04 has no poppler for Qt 6, so it's built here, for the PDF pages in Find Lost
          # Files' previews: the version DiskAnvil Live has. The hash is of the release tarball, whose
          # signature (Albert Astals Cid, CA262C6C83DE4D2FB28A332A3A6A4DB839EAA6D7) was checked.
          wget -q https://poppler.freedesktop.org/poppler-25.03.0.tar.xz
          echo '97da4ff88517a6bbd729529f195f85c8d7a0c3bb4a3d57cb0c685cbb052fe837  poppler-25.03.0.tar.xz' | sha256sum -c
          tar xf poppler-25.03.0.tar.xz
          cmake -S poppler-25.03.0 -B poppler-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_QT5=OFF -DENABLE_QT6=ON -DENABLE_GLIB=OFF -DENABLE_CPP=OFF -DENABLE_UTILS=OFF -DENABLE_BOOST=OFF \
            -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF -DENABLE_LIBCURL=OFF -DENABLE_LIBTIFF=OFF \
            -DBUILD_GTK_TESTS=OFF -DBUILD_QT5_TESTS=OFF -DBUILD_QT6_TESTS=OFF -DBUILD_CPP_TESTS=OFF -DBUILD_MANUAL_TESTS=OFF
          cmake --build poppler-build
          sudo cmake --install poppler-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DDISKANVIL_SELFTEST=OFF -DDISKANVIL_SYSTEMD_UNIT=OFF
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build
          # linuxdeploy wants a bare program name in Exec
          sed -i 's|^Exec=.*|Exec=diskanvil|' AppDir/usr/share/applications/io.github.DannyS124.DiskAnvil.desktop
      - name: Package
        env:
          OUTPUT: DiskAnvil-x86_64.AppImage
          LDAI_OUTPUT: DiskAnvil-x86_64.AppImage
          EXTRA_QT_MODULES: svg
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so # for running it without a screen, like the check below
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
          SUMS
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            -d AppDir/usr/share/applications/io.github.DannyS124.DiskAnvil.desktop \
            -i AppDir/usr/share/icons/hicolor/scalable/apps/io.github.DannyS124.DiskAnvil.svg
      - name: Check it starts
        run: |
          [ "$(QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 ./DiskAnvil-x86_64.AppImage --version)" = "diskanvil $(sed -n 's/^    VERSION //p' CMakeLists.txt)" ]
          # and that it has what the other builds have: PDF pages, the extra picture kinds, and films
          # and songs that play, with everything the media plugin needs
          ./DiskAnvil-x86_64.AppImage --appimage-extract >/dev/null
          ls squashfs-root/usr/lib/libpoppler-qt6.so.* squashfs-root/usr/plugins/imageformats/libqwebp.so \
            squashfs-root/usr/lib/libQt6Multimedia.so.6 squashfs-root/usr/plugins/multimedia/libffmpegmediaplugin.so
          ! LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/plugins/multimedia/libffmpegmediaplugin.so | grep 'not found'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DiskAnvil-x86_64.AppImage
          path: DiskAnvil-x86_64.AppImage

  attach:
    if: github.event_name == 'release' || inputs.tag != ''
    needs: [flatpak, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job can add files to the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ls -l
          sha256sum DiskAnvil-x86_64.flatpak DiskAnvil-x86_64.AppImage > SHA256SUMS-bundles
          gh release upload "$TAG" -R "${{ github.repository }}" --clobber \
            DiskAnvil-x86_64.flatpak DiskAnvil-x86_64.AppImage SHA256SUMS-bundles
