body:
  - type: textarea
    id: question
    attributes:
      label: What do you want to do?
      description: Something not working is a bug, and goes in Issues instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - Linux
        - Windows
        - DiskAnvil Live (the USB stick)
  - type: input
    id: version
    attributes:
      label: DiskAnvil version
      description: Help → About DiskAnvil, or `diskanvil --version`
      placeholder: "0.5.3"
