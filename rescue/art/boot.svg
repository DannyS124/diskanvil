<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Behind the boot menu (Secure Boot off, and old BIOS PCs). The menu itself is drawn by
       GRUB from boot/theme.txt, in the space under the name. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1124"/>
      <stop offset="1" stop-color="#03060e"/>
    </linearGradient>
    <radialGradient id="glow" cx="960" cy="150" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#1f6fff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#1f6fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1f6fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <image x="890" y="56" width="140" height="140" xlink:href="diskanvil-live-icon.svg"/>
  <text x="960" y="276" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="64" letter-spacing="-1" fill="#9ad8ff">Disk<tspan fill="#00e5ff">Anvil</tspan><tspan fill="#2bee8a" dx="18">Live</tspan></text>
  <text x="960" y="316" text-anchor="middle" font-family="DejaVu Sans" font-size="22" letter-spacing="4" fill="#7f93b5">RESCUE  ·  RECOVER  ·  REPAIR</text>
  <rect x="560" y="344" width="800" height="2" fill="url(#rule)"/>
</svg>
