[General]
__userfile__=true

# The start button on the left, open windows as icons next to it (like Windows 11 does them),
# the tray and the clock on the right. The colours come from the diskanvil-live LXQt theme. LXQt
# can't keep the start button in the middle: its place would change with every window. No drive
# pop-up: DiskAnvil does drives, and that one offers to eject the DiskAnvil Live stick itself.
[panel1]
plugins=fancymenu,quicklaunch,taskbar,statusnotifier,tray,worldclock,showdesktop
position=Bottom
desktop=0
panelSize=44
iconSize=24

[fancymenu]
type=fancymenu
alignment=Left
filterClear=true
autoSel=true
autoSelDelay=150

[quicklaunch]
type=quicklaunch
alignment=Left
apps\1\desktop=/usr/share/applications/io.github.DannyS124.DiskAnvil.desktop
apps\2\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\3\desktop=/usr/share/applications/firefox-esr.desktop
apps\4\desktop=/usr/share/applications/qterminal.desktop
apps\size=4

[taskbar]
type=taskbar
buttonStyle=Icon
buttonWidth=44
closeOnMiddleClick=true
groupingEnabled=false

[worldclock]
type=worldclock
alignment=Right
formatType=short
dateFormatType=short
datePosition=below
dateShowYear=true

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray
