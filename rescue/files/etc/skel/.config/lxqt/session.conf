# DiskAnvil Live has no screen locker (nothing to lock on a rescue stick), and LXQt locks the
# screen before the PC sleeps unless this is off. With it on, Sleep Now in Secure Erase showed
# "Screen Saver Error". Everything else comes from /usr/share/lxqt/session.conf.
[General]
leave_confirmation=true
lock_screen_before_power_actions=false
