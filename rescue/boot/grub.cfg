# The DiskForge Live boot menu. The same for UEFI (Secure Boot on or off) and old BIOS PCs.
# make-image.sh fills in the @...@ parts.

search --no-floppy --set=root --file /.disk/diskforge-live-@ID@
set prefix=($root)/boot/grub
set default=0
set timeout=10
# DiskForge Live's colours, as close as text mode gets (it only has 16): blue for the chosen entry.
set color_normal=light-gray/black
set menu_color_normal=light-cyan/black
set menu_color_highlight=white/blue

# With Secure Boot on, Debian's GRUB won't load font files (a font bug could be used to get
# past Secure Boot), so the menu stays in plain text there. Off, and on BIOS PCs, it gets the
# theme. Not even trying keeps "prohibited by secure boot policy" off the screen.
if [ "$lockdown" != "y" ]; then
    if loadfont $prefix/fonts/unicode.pf2; then
        loadfont $prefix/fonts/dejavu-14.pf2
        loadfont $prefix/fonts/dejavu-16.pf2
        loadfont $prefix/fonts/dejavu-18.pf2
        loadfont $prefix/fonts/dejavu-bold-18.pf2
        # 1024x768 first: every PC's firmware has it, and "auto" alone picked a mode a few
        # pixels big on some (QEMU's), which left the screen blank.
        set gfxmode=1024x768,800x600,auto
        set gfxpayload=keep
        # On UEFI only the firmware's own graphics; all_video also brings drivers that program
        # some cards directly.
        if [ "$grub_platform" = "efi" ]; then
            insmod efi_gop
        else
            insmod all_video
        fi
        insmod gfxterm
        insmod png
        terminal_output gfxterm
        set theme=$prefix/theme.txt
    fi
fi

# Kept changes: a partition called "persistence" on the stick (Make a DiskForge Live USB makes one
# when asked). When it's there, starting with it is the first entry.
insmod ext2
search --no-floppy --label persistence --set=persist --hint=$root
if [ -n "$persist" ]; then
    menuentry "Start DiskForge Live, keeping my changes" --hotkey=k {
        echo "Starting DiskForge Live @VERSION@, keeping your changes..."
        linux /live/vmlinuz boot=live persistence persistence-label=persistence quiet splash
        initrd /live/initrd.img
    }
fi
menuentry "Start DiskForge Live" --hotkey=s {
    echo "Starting DiskForge Live @VERSION@..."
    linux /live/vmlinuz boot=live quiet splash
    initrd /live/initrd.img
}
menuentry "Drives write-protected (for evidence)" --hotkey=w {
    echo "Starting DiskForge Live with every drive but this stick read-only..."
    linux /live/vmlinuz boot=live diskforge-live.writeblock quiet splash
    initrd /live/initrd.img
}
menuentry "Safe graphics (if the screen stays black)" --hotkey=g {
    echo "Starting with safe graphics..."
    linux /live/vmlinuz boot=live nomodeset
    initrd /live/initrd.img
}
menuentry "Text mode (no desktop)" --hotkey=t {
    echo "Starting in text mode..."
    linux /live/vmlinuz boot=live diskforge-live.text
    initrd /live/initrd.img
}
menuentry "Copy to memory (then the stick can come out)" --hotkey=m {
    echo "Copying DiskForge Live to memory first. This takes a minute or two..."
    linux /live/vmlinuz boot=live toram quiet splash
    initrd /live/initrd.img
}

submenu "Tools and troubleshooting..." --hotkey=u {
    if [ -s $prefix/theme.txt ]; then set theme=$prefix/theme.txt; fi

    # memtest86+ isn't signed, so a PC with Secure Boot on refuses to start it. GRUB sets
    # shim_lock (and lockdown) when Secure Boot is on.
    if [ "$grub_platform" = "efi" ]; then
        if [ "$shim_lock" = "y" -o "$lockdown" = "y" ]; then
            menuentry "Memory test (needs Secure Boot off)" {
                echo "memtest86+ @MEMTEST@ isn't signed for Secure Boot, so this PC won't start it."
                echo
                echo "To test the memory: open the firmware settings (in this menu), turn Secure Boot"
                echo "off, start the stick again and pick Memory test. Turn Secure Boot back on after."
                echo
                echo "Going back to the menu in 30 seconds (or press Esc)."
                sleep --interruptible 30
            }
        else
            menuentry "Memory test (memtest86+ @MEMTEST@)" {
                linux /boot/memtest86+x64.efi
            }
        fi
    else
        menuentry "Memory test (memtest86+ @MEMTEST@)" {
            linux /boot/memtest86+x64.bin
        }
    fi

    menuentry "Detailed messages (also to the serial port)" {
        echo "Starting with detailed messages..."
        linux /live/vmlinuz boot=live debug ignore_loglevel systemd.show_status=1 systemd.journald.forward_to_console=1 console=tty0 console=ttyS0,115200n8
        initrd /live/initrd.img
    }
    menuentry "Check the stick for damaged files" {
        echo "Checking every file on the stick..."
        linux /live/vmlinuz boot=live verify-checksums
        initrd /live/initrd.img
    }
    if [ "$grub_platform" = "efi" ]; then
        menuentry "Firmware settings (UEFI setup)" {
            fwsetup
        }
    fi
    menuentry "Restart" {
        reboot
    }
    menuentry "Turn off" {
        halt
    }
}
