# The DiskAnvil Live boot menu. The same for UEFI (Secure Boot on or off) and old BIOS PCs.
# make-image.sh fills in the @...@ parts.

search --no-floppy --set=root --file /.disk/diskanvil-live-@ID@
set prefix=($root)/boot/grub
set default=0
set timeout=10
# DiskAnvil Live's colours, as close as text mode gets (it only has 16): blue for the chosen entry.
set color_normal=light-gray/black
set menu_color_normal=light-cyan/black
set menu_color_highlight=white/blue

# With Secure Boot on, Debian's GRUB won't load font files (a font bug could be used to get
# past Secure Boot), so the menu stays in plain text there. Off, and on BIOS PCs, it gets the
# theme. Not even trying keeps "prohibited by secure boot policy" off the screen.
if [ "$lockdown" != "y" ]; then
    if loadfont $prefix/fonts/unicode.pf2; then
        loadfont $prefix/fonts/dejavu-14.pf2
        loadfont $prefix/fonts/dejavu-16.pf2
        loadfont $prefix/fonts/dejavu-18.pf2
        loadfont $prefix/fonts/dejavu-bold-18.pf2
        # 1024x768 first: every PC's firmware has it, and "auto" alone picked a mode a few
        # pixels big on some (QEMU's), which left the screen blank.
        set gfxmode=1024x768,800x600,auto
        set gfxpayload=keep
        # On UEFI only the firmware's own graphics; all_video also brings drivers that program
        # some cards directly.
        if [ "$grub_platform" = "efi" ]; then
            insmod efi_gop
        else
            insmod all_video
        fi
        insmod gfxterm
        insmod png
        terminal_output gfxterm
        set theme=$prefix/theme.txt
    fi
fi

# The entries' names. With Secure Boot on the menu is plain text, and some firmware's text screen
# leaves room for very few letters (22 in QEMU's): short names there, that still tell the entries
# apart. The themed menu has room for the longer ones.
if [ "$lockdown" = "y" ]; then
    set n_keep="Start, keeping changes"
    set n_start="Start DiskAnvil Live"
    set n_protect="Drives write-protected"
    set n_safe="Safe graphics"
    set n_text="Text mode"
    set n_toram="Copy to memory"
    set n_isos="Other ISOs"
    set n_tools="Troubleshooting"
    set n_detail="Detailed messages"
    set n_check="Check the stick"
    set n_fw="Firmware settings"
else
    set n_keep="Start DiskAnvil Live, keeping my changes"
    set n_start="Start DiskAnvil Live"
    set n_protect="Drives write-protected (for evidence)"
    set n_safe="Safe graphics (if the screen stays black)"
    set n_text="Text mode (no desktop)"
    set n_toram="Copy to memory (then the stick can come out)"
    set n_isos="Other ISOs on this stick..."
    set n_tools="Tools and troubleshooting..."
    set n_detail="Detailed messages (also to the serial port)"
    set n_check="Check the stick for damaged files"
    set n_fw="Firmware settings (UEFI setup)"
fi
export n_detail n_check n_fw

# Kept changes: a partition called "persistence" on the stick (Make a DiskAnvil Live USB makes one
# when asked). When it's there, starting with it is the first entry.
insmod ext2
search --no-floppy --label persistence --set=persist --hint=$root
if [ -n "$persist" ]; then
    menuentry "$n_keep" --hotkey=k {
        echo "Starting DiskAnvil Live @VERSION@, keeping your changes..."
        linux /live/vmlinuz boot=live persistence persistence-label=persistence quiet splash
        initrd /live/initrd.img
    }
fi
menuentry "$n_start" --hotkey=s {
    echo "Starting DiskAnvil Live @VERSION@..."
    linux /live/vmlinuz boot=live quiet splash
    initrd /live/initrd.img
}
menuentry "$n_protect" --hotkey=w {
    echo "Starting DiskAnvil Live with every drive but this stick read-only..."
    linux /live/vmlinuz boot=live diskanvil-live.writeblock quiet splash
    initrd /live/initrd.img
}
menuentry "$n_safe" --hotkey=g {
    echo "Starting with safe graphics..."
    linux /live/vmlinuz boot=live nomodeset
    initrd /live/initrd.img
}
menuentry "$n_text" --hotkey=t {
    echo "Starting in text mode..."
    linux /live/vmlinuz boot=live diskanvil-live.text
    initrd /live/initrd.img
}
menuentry "$n_toram" --hotkey=m {
    echo "Copying DiskAnvil Live to memory first. This takes a minute or two..."
    linux /live/vmlinuz boot=live toram quiet splash
    initrd /live/initrd.img
}

# Other ISOs: .iso files in the ISOs folder of the stick's ANVIL-FILES drive (exFAT; Make a
# DiskAnvil Live USB makes it when asked) start from here, without copying them anywhere. Debian's
# signed GRUB has no exFAT built in and with Secure Boot on loads nothing more (and other systems'
# kernels aren't signed with Debian's key anyway), so that needs Secure Boot off; then, and on BIOS
# PCs, exFAT comes from the stick.
if [ "$lockdown" != "y" ]; then
    insmod exfat
    insmod regexp
    insmod loopback
    insmod iso9660
    search --no-floppy --label ANVIL-FILES --set=files
fi
export files
submenu "$n_isos" --hotkey=o {
    if [ -s $prefix/theme.txt ]; then set theme=$prefix/theme.txt; fi
    if [ "$lockdown" = "y" ]; then
        menuentry "Needs Secure Boot off" {
            echo "With Secure Boot on, this stick can't look inside the ANVIL-FILES drive, and other systems"
            echo "wouldn't start anyway (they're signed by their own makers, not Debian)."
            echo
            echo "Turn Secure Boot off in the firmware settings (Tools and troubleshooting), start the stick"
            echo "again and pick Other ISOs. Turn Secure Boot back on after."
            echo
            echo "Going back to the menu in 30 seconds (or press Esc)."
            sleep --interruptible 30
        }
    elif [ -z "$files" ]; then
        menuentry "This stick has no drive for ISOs" {
            echo "Make the stick again with \"A drive for my files\" ticked (or update it, if it has one),"
            echo "then copy .iso files into the ISOs folder of its ANVIL-FILES drive, from any computer."
            echo
            echo "Going back to the menu in 30 seconds (or press Esc)."
            sleep --interruptible 30
        }
    else
        set found=
        for iso in ($files)/ISOs/*.iso ($files)/ISOs/*.ISO; do
            # A pattern that matches nothing stays as it is.
            if [ ! -f "$iso" ]; then continue; fi
            set found=y
            regexp --set=1:name "/([^/]*)\$" "$iso"
            menuentry "$name" "$iso" {
                # The ISO's path on the drive, for the systems that look for it themselves.
                regexp --set=1:iso_path "^\\([^)]*\\)(/.*)\$" "$2"
                export iso_path
                loopback loop "$2"
                set root=(loop)
                if [ -f /boot/grub/loopback.cfg ]; then
                    # Most Linux ISOs come with this, for starting from inside an ISO file.
                    configfile /boot/grub/loopback.cfg
                elif [ -f /live/vmlinuz ]; then
                    # Debian Live and the ones made like it: Clonezilla, GParted Live, older DiskAnvil Live
                    linux /live/vmlinuz boot=live findiso=$iso_path components quiet splash
                    initrd /live/initrd.img
                elif [ -f /casper/vmlinuz ]; then
                    # Ubuntu and the ones made from it
                    linux /casper/vmlinuz boot=casper iso-scan/filename=$iso_path quiet splash
                    initrd /casper/initrd*
                elif [ -f /arch/boot/x86_64/vmlinuz-linux ]; then
                    probe --set=uuid --fs-uuid $files
                    linux /arch/boot/x86_64/vmlinuz-linux img_dev=/dev/disk/by-uuid/$uuid img_loop=$iso_path archisobasedir=arch
                    initrd /arch/boot/x86_64/initramfs-linux.img
                elif [ -f /images/pxeboot/vmlinuz ]; then
                    # Fedora and the ones made like it
                    probe --set=label --label (loop)
                    linux /images/pxeboot/vmlinuz root=live:CDLABEL=$label iso-scan/filename=$iso_path rd.live.image quiet
                    initrd /images/pxeboot/initrd.img
                elif [ -f /sources/install.wim -o -f /sources/install.esd -o -f /sources/install.swm ]; then
                    echo "This is a Windows ISO. Windows can't start from inside an ISO file:"
                    echo "make a Windows USB from it with DiskAnvil instead (Make a Windows USB)."
                    echo
                    echo "Going back to the menu in 30 seconds (or press Esc)."
                    sleep --interruptible 30
                else
                    echo "DiskAnvil Live doesn't know how to start this ISO from here."
                    echo "Write it to a stick of its own with Write Image to USB instead."
                    echo
                    echo "Going back to the menu in 30 seconds (or press Esc)."
                    sleep --interruptible 30
                fi
            }
        done
        if [ -z "$found" ]; then
            menuentry "No ISOs yet" {
                echo "Copy .iso files into the ISOs folder of this stick's ANVIL-FILES drive, from any computer"
                echo "(Windows, a Mac, Linux), and they show up here."
                echo
                echo "Going back to the menu in 30 seconds (or press Esc)."
                sleep --interruptible 30
            }
        fi
    fi
}

submenu "$n_tools" --hotkey=u {
    if [ -s $prefix/theme.txt ]; then set theme=$prefix/theme.txt; fi

    # memtest86+ isn't signed, so a PC with Secure Boot on refuses to start it. GRUB sets
    # shim_lock (and lockdown) when Secure Boot is on.
    if [ "$grub_platform" = "efi" ]; then
        if [ "$shim_lock" = "y" -o "$lockdown" = "y" ]; then
            menuentry "Memory test" {
                echo "memtest86+ @MEMTEST@ isn't signed for Secure Boot, so this PC won't start it."
                echo
                echo "To test the memory: open the firmware settings (in this menu), turn Secure Boot"
                echo "off, start the stick again and pick Memory test. Turn Secure Boot back on after."
                echo
                echo "Going back to the menu in 30 seconds (or press Esc)."
                sleep --interruptible 30
            }
        else
            menuentry "Memory test (memtest86+ @MEMTEST@)" {
                linux /boot/memtest86+x64.efi
            }
        fi
    else
        menuentry "Memory test (memtest86+ @MEMTEST@)" {
            linux /boot/memtest86+x64.bin
        }
    fi

    menuentry "$n_detail" {
        echo "Starting with detailed messages..."
        linux /live/vmlinuz boot=live debug ignore_loglevel systemd.show_status=1 systemd.journald.forward_to_console=1 console=tty0 console=ttyS0,115200n8
        initrd /live/initrd.img
    }
    menuentry "$n_check" {
        echo "Checking every file on the stick..."
        linux /live/vmlinuz boot=live verify-checksums
        initrd /live/initrd.img
    }
    if [ "$grub_platform" = "efi" ]; then
        menuentry "$n_fw" {
            fwsetup
        }
    fi
    menuentry "Restart" {
        reboot
    }
    menuentry "Turn off" {
        halt
    }
}
