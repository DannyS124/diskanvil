# A fallback next to GRUB. It normally finds the menu by itself; if it ends up here instead,
# this finds our stick by the build's own file and reads the real menu from there.
search --no-floppy --set=root --file /.disk/diskanvil-live-@ID@
set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg
